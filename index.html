    <style>
      #root { background: #f9fafb; min-height: 100vh; }
      .zync-startup {
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 18px;
        min-height: 100vh;
        min-height: 100svh;
        background: radial-gradient(ellipse at 50% 38%, #fff 8%, #eff5ff 68%, #eaf2fd);
      }
      .zync-startup-logo { display: block; width: 148px; height: auto; }
      .zync-startup-track {
        width: 176px;
        height: 6px;
        border-radius: 999px;
        background: #dde7f7;
        overflow: hidden;
      }
      .zync-startup-track::before {
        content: '';
        display: block;
        width: 38%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #245be0, #18a6e3 65%, #f97316);
        animation: zync-startup-slide .55s linear infinite alternate;
      }
      .zync-startup-label { margin: -6px 0 0; font: 500 13px/1.4 'IBM Plex Sans', system-ui, sans-serif; color: #385271; }
      @keyframes zync-startup-slide {
        from { transform: translateX(0); }
        to { transform: translateX(163%); }
      }
    </style>
    <!-- Tailwind CDN for development - will be replaced by Vite plugin in production -->

        <p class="zync-startup-label">Loading ZyncJobs</p>

    </div>
